<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTR 班次與天氣</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        body { font-family: -apple-system, sans-serif; background-color: #121214; color: #ffffff; margin: 0; padding: 20px; }
        .container { max-width: 480px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .info-box { font-size: 14px; color: #aaa; text-align: right; }
        .error { color: #ff3b30; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🚇 MTR 即時</h1>
        <div class="info-box">
            <div id="time-display">更新時間: 讀取中...</div>
            <div id="weather-display">天氣: 讀取中...</div>
        </div>
    </div>
    <div id="content">載入中...</div>
</div>

<script>
    async function updateAll() {
        // 1. 更新時間
        document.getElementById('time-display').innerText = "更新時間: " + new Date().toLocaleTimeString('zh-HK', { hour12: false });

        // 2. 獲取天氣 (改用最簡單的 fetch 且加強錯誤處理)
        try {
            const response = await fetch("https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrh&lang=tc");
            if (!response.ok) throw new Error("API 不回應");
            const data = await response.json();
            
            // 安全獲取數據
            const temp = data.temperature?.data?.[0]?.value ?? "--";
            const hum = data.humidity?.data?.[0]?.value ?? "--";
            document.getElementById('weather-display').innerText = `天氣: ${temp}°C / 濕度 ${hum}%`;
        } catch (err) {
            document.getElementById('weather-display').innerHTML = `<span class="error">天氣讀取失敗</span>`;
        }

        // 3. 確保主內容不被中斷
        document.getElementById('content').innerText = "系統運作正常，正在更新班次...";
    }

    // 初始化與循環
    updateAll();
    setInterval(updateAll, 60000);
</script>

</body>
</html>
