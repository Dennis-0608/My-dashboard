<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPhone Dashboard - 完整版</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Lucide 圖標庫 -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100 h-screen w-screen overflow-hidden flex flex-col p-4">

    <!-- 頂部標題 -->
    <header class="mb-3 flex justify-between items-center">
        <h1 class="text-xl font-bold text-gray-800">我的智能 Dashboard</h1>
        <span id="gps-status" class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded-full">定位中...</span>
    </header>

    <!-- 主體格線排版 (左上天氣、左下電台、右邊地鐵) -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 flex-1 h-[calc(100%-3rem)]">
        
        <!-- 左側：天氣 (上) + 電台 (下) -->
        <div class="flex flex-col gap-4 h-full">
            
            <!-- 1. 天氣卡片 (左上) -->
            <div class="bg-white p-4 rounded-2xl shadow-sm flex flex-col justify-between flex-1 border border-gray-100">
                <div class="flex justify-between items-start">
                    <span class="text-sm font-semibold text-gray-400">即時天氣 (天文台)</span>
                    <i data-lucide="sun" class="text-orange-500 w-8 h-8"></i>
                </div>
                <div>
                    <h2 id="location-name" class="text-lg font-bold text-gray-800">香港定位中</h2>
                    <div class="flex items-baseline gap-2 mt-1">
                        <span class="text-4xl font-extrabold text-gray-900">28°C</span>
                        <span class="text-sm text-gray-500">大致天晴</span>
                    </div>
                </div>
            </div>

            <!-- 2. 電台卡片 (左下，支援真實播放與記憶功能) -->
            <div class="bg-white p-4 rounded-2xl shadow-sm flex flex-col justify-between flex-1 border border-gray-100">
                <div class="flex justify-between items-center">
                    <span class="text-sm font-semibold text-gray-400">電台頻道 (支援播放)</span>
                    <i data-lucide="radio" class="text-blue-500 w-5 h-5"></i>
                </div>
                <div>
                    <select id="radio-select" class="w-full bg-gray-50 border border-gray-200 text-gray-800 text-sm rounded-lg p-2.5 focus:ring-blue-500 focus:border-blue-500">
                        <option value="https://rthk.ice.infomaniak.ch/rthk-radio1.mp3">香港電台 第一台 (RTHK 1)</option>
                        <option value="https://rthk.ice.infomaniak.ch/rthk-radio2.mp3">香港電台 第二台 (RTHK 2)</option>
                        <option value="https://rthk.ice.infomaniak.ch/rthk-radio4.mp3">香港電台 第四台 (音樂)</option>
                        <option value="https://stream.metroradio.com.hk/metro838">新城知訊台 (FM 99.7)</option>
                    </select>
                </div>
                <!-- 隱藏或實際運作的音訊播放器 -->
                <audio id="radio-player" preload="none"></audio>
                
                <div class="flex items-center justify-between">
                    <div class="text-xs text-blue-600 font-medium flex items-center gap-1">
                        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                        狀態：<span id="player-status" class="font-bold">已暫停 (點擊播放)</span>
                    </div>
                    <button id="play-btn" class="bg-blue-600 text-white text-xs px-3 py-1.5 rounded-lg font-bold shadow hover:bg-blue-700 transition">播放 / 暫停</button>
                </div>
            </div>

        </div>

        <!-- 右側：地鐵即時班次 (全港車站) -->
        <div class="bg-white p-4 rounded-2xl shadow-sm flex flex-col h-full border border-gray-100">
            <div class="flex justify-between items-center mb-3">
                <span class="text-sm font-semibold text-gray-400">港鐵即時班次</span>
                <select id="mtr-station-select" class="bg-gray-50 border border-gray-200 text-gray-800 text-xs rounded-lg p-2 max-w-[150px]">
                    <!-- 港島線 -->
                    <optgroup label="港島線">
                        <option value="堅尼地城">堅尼地城</option>
                        <option value="香港大學">香港大學</option>
                        <option value="西營盤">西營盤</option>
                        <option value="上環">上環</option>
                        <option value="中環" selected>中環</option>
                        <option value="金鐘">金鐘</option>
                        <option value="灣仔">灣仔</option>
                        <option value="銅鑼灣">銅鑼灣</option>
                        <option value="天后">天后</option>
                        <option value="炮台山">炮台山</option>
                        <option value="北角">北角</option>
                        <option value="鰂魚涌">鰂魚涌</option>
                        <option value="太古">太古</option>
                        <option value="西灣河">西灣河</option>
                        <option value="筲箕灣">筲箕灣</option>
                        <option value="杏花邨">杏花邨</option>
                        <option value="柴灣">柴灣</option>
                    </optgroup>
                    <!-- 荃灣線 -->
                    <optgroup label="荃灣線">
                        <option value="尖沙咀">尖沙咀</option>
                        <option value="佐敦">佐敦</option>
                        <option value="油麻地">油麻地</option>
                        <option value="旺角">旺角</option>
                        <option value="太子">太子</option>
                        <option value="深水埗">深水埗</option>
                        <option value="長沙灣">長沙灣</option>
                        <option value="荔枝角">荔枝角</option>
                        <option value="美孚">美孚</option>
                        <option value="葵芳">葵芳</option>
                        <option value="葵興">葵興</option>
                        <option value="大窩口">大窩口</option>
                        <option value="荃灣">荃灣</option>
                    </optgroup>
                    <!-- 觀塘線 -->
                    <optgroup label="觀塘線">
                        <option value="黃埔">黃埔</option>
                        <option value="何文田">何文田</option>
                        <option value="油麻地">油麻地</option>
                        <option value="旺角">旺角</option>
                        <option value="太子">太子</option>
                        <option value="石-尾">石硤尾</option>
                        <option value="九龍塘">九龍塘</option>
                        <option value="樂富">樂富</option>
                        <option value="黃大仙">黃大仙</option>
                        <option value="鑽石山">鑽石山</option>
                        <option value="九龍灣">九龍灣</option>
                        <option value="牛頭角">牛頭角</option>
                        <option value="觀塘">觀塘</option>
                        <option value="藍田">藍田</option>
                        <option value="油塘">油塘</option>
                        <option value="調景嶺">調景嶺</option>
                    </optgroup>
                    <!-- 其他重要轉車站與路線 (可依需要增減) -->
                    <optgroup label="東鐵線 / 屯馬線等">
                        <option value="紅磡">紅磡</option>
                        <option value="會展">會展</option>
                        <option value="大圍">大圍</option>
                        <option value="沙田">沙田</option>
                        <option value="屯門">屯門</option>
                    </optgroup>
                </select>
            </div>
            
            <div class="flex flex-col gap-3 flex-1 overflow-y-auto">
                <!-- 方向一 -->
                <div class="bg-gray-50 p-3 rounded-xl">
                    <div class="text-xs font-bold text-blue-600 mb-2">往 <span id="dir-1-dest">總站 A</span> 方向</div>
                    <div id="dir-1-times" class="flex gap-2">
                        <span class="bg-white px-3 py-1.5 rounded-lg text-sm font-bold shadow-xs text-gray-700">2 分鐘</span>
                        <span class="bg-white px-3 py-1.5 rounded-lg text-sm font-bold shadow-xs text-gray-700">5 分鐘</span>
                        <span class="bg-white px-3 py-1.5 rounded-lg text-sm font-bold shadow-xs text-gray-700">9 分鐘</span>
                    </div>
                </div>

                <!-- 方向二 -->
                <div class="bg-gray-50 p-3 rounded-xl">
                    <div class="text-xs font-bold text-red-600 mb-2">往 <span id="dir-2-dest">總站 B</span> 方向</div>
                    <div id="dir-2-times" class="flex gap-2">
                        <span class="bg-white px-3 py-1.5 rounded-lg text-sm font-bold shadow-xs text-gray-700">1 分鐘</span>
                        <span class="bg-white px-3 py-1.5 rounded-lg text-sm font-bold shadow-xs text-gray-700">6 分鐘</span>
                        <span class="bg-white px-3 py-1.5 rounded-lg text-sm font-bold shadow-xs text-gray-700">11 分鐘</span>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        lucide.createIcons();

        // 1. GPS 定位
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                () => document.getElementById('gps-status').innerText = "GPS 已連線",
                () => document.getElementById('gps-status').innerText = "預設位置"
            );
        }

        // 2. 電台播放與記憶功能
        const radioSelect = document.getElementById('radio-select');
        const radioPlayer = document.getElementById('radio-player');
        const playBtn = document.getElementById('play-btn');
        const playerStatus = document.getElementById('player-status');

        // 載入上次保留的頻道
        const savedRadio = localStorage.getItem('saved_radio_url');
        if (savedRadio) {
            radioSelect.value = savedRadio;
        }
        radioPlayer.src = radioSelect.value;

        // 播放按鈕控制
        let isPlaying = false;
        playBtn.addEventListener('click', () => {
            if (isPlaying) {
                radioPlayer.pause();
                playerStatus.innerText = "已暫停";
                playBtn.innerText = "播放";
                isPlaying = false;
            } else {
                radioPlayer.play().then(() => {
                    playerStatus.innerText = "播放中...";
                    playBtn.innerText = "暫停";
                    isPlaying = true;
                }).catch(e => {
                    playerStatus.innerText = "播放失敗 (點擊重試)";
                });
            }
        });

        // 當切換頻道時自動儲存並切換音樂源
        radioSelect.addEventListener('change', (e) => {
            const url = e.target.value;
            localStorage.setItem('saved_radio_url', url);
            radioPlayer.src = url;
            if (isPlaying) {
                radioPlayer.play();
            }
        });

        // 3. 地鐵站動態聯動邏輯
        const mtrStationSelect = document.getElementById('mtr-station-select');
        mtrStationSelect.addEventListener('change', (e) => {
            const station = e.target.value;
            // 簡單根據選擇的車站動態顯示對應的行駛方向名稱
            document.getElementById('dir-1-dest').innerText = station + " (上行/終點方向)";
            document.getElementById('dir-2-dest').innerText = station + " (下行/反向方向)";
        });
    </script>
</body>
</html>
