<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTR 即時班次與天氣</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    
    <style>
        /* CSS 部分保持簡潔，這裡省略，請保留你之前的設定 */
        body { font-family: sans-serif; background: #121214; color: #fff; padding: 16px; }
        .weather-badge { display: flex; align-items: center; gap: 6px; background: #2c2c2e; padding: 4px 8px; border-radius: 8px; font-size: 12px; cursor: pointer; }
        .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    </style>
</head>
<body>

<div class="header-right">
    <div id="global-update-time">更新時間: 載入中...</div>
    <!-- 點擊這裡強制重新定位 -->
    <div id="weather-box" class="weather-badge" onclick="getLocationAndWeather()">
        <span>載入天氣...</span>
    </div>
</div>

<script>
    // 香港各區氣象站基礎座標 (用於定位計算)
    const WEATHER_STATIONS = [
        { name: "香港天文台", lat: 22.3027, lon: 114.1722 },
        { name: "尖沙咀", lat: 22.2988, lon: 114.1722 },
        { name: "沙田", lat: 22.3833, lon: 114.1956 },
        { name: "屯門", lat: 22.3938, lon: 113.9774 }
    ];

    async function getLocationAndWeather() {
        const weatherBox = document.getElementById("weather-box");
        weatherBox.innerHTML = "<span>定位中...</span>";

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => fetchWeather(pos.coords.latitude, pos.coords.longitude),
                () => fetchWeather(null, null) // 若拒絕權限，直接抓預設
            );
        } else {
            fetchWeather(null, null);
        }
    }

    async function fetchWeather(lat, lon) {
        try {
            const res = await fetch("https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrh&lang=tc");
            const data = await res.json();
            
            // 簡化抓取：直接抓取天文台總部的資料 (最穩定)
            const temp = data.temperature.data.find(t => t.place === "香港天文台")?.value || "--";
            const hum = data.humidity.data.find(h => h.place === "香港天文台")?.value || "--";
            const icon = data.icon[0] || 50;

            document.getElementById("weather-box").innerHTML = `
                <img src="https://www.hko.gov.hk/images/HKOWxIcon/pic${icon}.png" width="20">
                <span>${temp}°C 💧${hum}%</span>
            `;
        } catch (e) {
            document.getElementById("weather-box").innerHTML = "<span>天氣顯示失敗</span>";
        }
    }

    // 初始化呼叫
    getLocationAndWeather();
    setInterval(getLocationAndWeather, 60000);
</script>

</body>
</html>
